version: 2

# Tests on SOURCES catch load problems before any transformation runs.
# This is the layer that catches the double-load demo: silver dedupes it
# away, so if you only tested silver you would never know it happened.
#
# Two flavors of referential-integrity contract live side by side here:
#   - `relationships` with ABSOLUTE thresholds (error_if: >150) — simple, but
#     silently loosens as volume grows.
#   - `ref_orphan_proportion` with a RATE threshold (max 1.5%) — the same
#     contract expressed in a way that survives a 100x volume change.
# Every result (pass/warn/fail, table, column, failure count) also lands in
# the queryable Delta audit table `qc_log` via the on-run-end hook.
sources:
  - name: lakehouse_demo
    catalog: workspace
    schema: lakehouse_demo
    tables:
      - name: bronze_orders
        description: Append-only landing table. One row per order PER LOAD.
        columns:
          - name: order_id
            tests:
              # Fires when simulate_double_load=true: every task stayed green,
              # this is the only thing in the pipeline that formally fails.
              - unique
              - not_null

      - name: silver_collectors
        columns:
          - name: collector_id
            tests: [unique, not_null]
          - name: email
            tests:
              # Vendor always sends ~2% null emails. severity: warn = log it,
              # don't page anyone at 2 AM for known dirt.
              - not_null:
                  config:
                    severity: warn

      - name: silver_shops
        columns:
          - name: shop_id
            tests: [unique, not_null]

      - name: silver_cards
        columns:
          - name: card_id
            tests: [unique, not_null]

      - name: silver_orders
        tests:
          # Volume test: a delivery that shrank or ballooned is wrong even if
          # every row in it is valid. Bounds = measured baseline (~10k) ± slack.
          - row_count_between:
              arguments:
                min_rows: 8000
                max_rows: 12000
        columns:
          - name: order_id
            tests: [unique, not_null]
          - name: collector_id
            tests:
              # Referential integrity with an ABSOLUTE threshold: the vendor
              # baseline is ~100 orphans (1% of 10k), so warn at the baseline
              # and only ERROR past 150 — that's a new problem, not the known
              # dirt. Measure the baseline BEFORE picking numbers.
              - relationships:
                  arguments:
                    to: source('lakehouse_demo', 'silver_collectors')
                    field: collector_id
                  config:
                    severity: error
                    warn_if: ">0"
                    error_if: ">150"
              # The same contract as a PROPORTION: fail if the orphan RATE
              # tops 1.5% (baseline ~1.1%). Unlike the absolute threshold,
              # this stays meaningful when volume grows 100x.
              - ref_orphan_proportion:
                  arguments:
                    to: source('lakehouse_demo', 'silver_collectors')
                    field: collector_id
                    max_orphan_pct: 1.5
          - name: shop_id
            tests:
              # Internal dimension we control — zero tolerance, plain error.
              - relationships:
                  arguments:
                    to: source('lakehouse_demo', 'silver_shops')
                    field: shop_id

      - name: silver_order_items
        tests:
          # ~2 items per order + 15 injected orphans → baseline ~20k.
          - row_count_between:
              arguments:
                min_rows: 15000
                max_rows: 35000
        columns:
          - name: order_item_id
            tests: [unique, not_null]
          - name: order_id
            tests:
              - relationships:
                  arguments:
                    to: source('lakehouse_demo', 'silver_orders')
                    field: order_id
          - name: card_id
            tests:
              # Measured baseline: ~15 orphan card refs per delivery.
              - relationships:
                  arguments:
                    to: source('lakehouse_demo', 'silver_cards')
                    field: card_id
                  config:
                    severity: error
                    warn_if: ">0"
                    error_if: ">25"
              # Rate version: 15 / ~20k ≈ 0.075% baseline → fail past 0.15%.
              - ref_orphan_proportion:
                  arguments:
                    to: source('lakehouse_demo', 'silver_cards')
                    field: card_id
                    max_orphan_pct: 0.15

      - name: silver_payments
        columns:
          - name: payment_id
            tests: [unique, not_null]
          - name: order_id
            tests:
              # A payment for an order that doesn't exist is money we can't
              # explain — no threshold, any row is an error.
              - relationships:
                  arguments:
                    to: source('lakehouse_demo', 'silver_orders')
                    field: order_id
